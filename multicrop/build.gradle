plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {

    namespace 'com.magd.multicrop'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Mahmoud-Magd'
                artifactId = 'MultiCrop'
                version = '1.0.0'
            }
        }
    }
}

dependencies {
}